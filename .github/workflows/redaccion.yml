# Redacción autónoma de Punto Ciego en GitHub Actions (gratis en repositorio público).
# Cada ejecución: auditoría + publicar lo que toque + buscar/encolar una historia, guarda
# el estado (cola, historial, sitio) en el repositorio y publica el sitio en GitHub Pages.
name: Redaccion Punto Ciego

on:
  schedule:
    # Minutos "raros": en :00/:15/:30/:45 GitHub está saturado y descarta ejecuciones programadas
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Nunca dos ciclos a la vez (publicarían doble)
concurrency:
  group: redaccion
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    # Hasta 25 min de espera si una publicación vence pronto + el ciclo
    timeout-minutes: 45
    environment:
      name: github-pages
    env:
      TZ: America/Bogota
      LINKEDIN_ENABLED: 'false'
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      PAGE_BRAND_NAME: Punto Ciego
      # https://<usuario>.github.io — el sitio se publica en el paso "GitHub Pages" de abajo;
      # los posts solo llevan el enlace cuando la página ya responde (ciclos siguientes)
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --no-fund --no-audit

      - name: Caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium (tarjetas y enlaces de Google News)
        run: npx playwright install --with-deps chromium

      - name: Ciclo de redacción
        run: npm run cloud:build --silent && node dist/cloud-run.js

      - name: Guardar estado en el repositorio
        id: estado
        if: always()
        run: |
          git config user.name "punto-ciego-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/*.json site public/news-cards
          [ -f storage/.ai-cooldown.json ] && git add -f storage/.ai-cooldown.json
          if git diff --cached --quiet -- site; then echo "site=false" >> "$GITHUB_OUTPUT"; else echo "site=true" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Estado de la redacción $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "No se pudo guardar el estado" && exit 1

      # Solo se republica el sitio cuando cambió (o al lanzar el workflow a mano)
      - name: Preparar sitio
        if: always() && (steps.estado.outputs.site == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages
        if: always() && (steps.estado.outputs.site == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/deploy-pages@v4
